
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Khallel Miguel M. Dadis</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
    try {
        const savedSettings = JSON.parse(
            localStorage.getItem("portfolioSettings")
        );

        if (savedSettings && savedSettings.theme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    } catch (error) {
        document.documentElement.classList.remove("dark-mode");
    }
</script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>

        <button
            id="theme-toggle"
            type="button"
            aria-pressed="false">
            Dark Mode
        </button>

        <button
            id="menu-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="main-navigation">
            Menu
        </button>

        <nav id="main-navigation" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

   <main>
    <section>
        <h2>Send Me a Message</h2>
        <p>This demo checks your inputs but does not send messages.</p>

        <form id="contact-form" action="#" novalidate>
            <p>
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    aria-describedby="name-error"
                    required>
                <span class="error-message" id="name-error" aria-live="polite"></span>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    aria-describedby="email-error"
                    required>
                <span class="error-message" id="email-error" aria-live="polite"></span>
            </p>

            <p>
                <label for="subject">Subject:</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    aria-describedby="subject-error"
                    required>
                <span class="error-message" id="subject-error" aria-live="polite"></span>
            </p>

            <p>
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    aria-describedby="message-error"
                    required></textarea>
                <span class="error-message" id="message-error" aria-live="polite"></span>
            </p>

            <p id="form-success" role="status" aria-live="polite"></p>

            <button type="submit" class="button">Send Message</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Khallel Miguel Dadis. All rights reserved.</p>
</footer>
</body>
</html>
